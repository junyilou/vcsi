[project]
name = "vcsi"
dynamic = ["version"]
description = "vcsi-lite: create video contact sheets"
authors = [{ name = "Nils Amiet", email = "amietn@foobar.tld" }]
requires-python = ">=3.15"
readme = "README.md"
license = "MIT"
# vcsi-lite: only the dependencies needed by the reduced vcsi_ui code path.
dependencies = [
    "pillow>=13.0",
]

[project.scripts]
vcsi = "vcsi.vcsi:main"

[dependency-groups]
dev = [
    "pytest>=7.3.1,<8",
    "pytest-cov>=4.0.0,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "vcsi/VERSION"
pattern = "^(?P<version>.+)$"
